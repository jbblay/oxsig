# Nixpacks configuration for OxSig Frontend
# Tells Railway to only build the frontend package

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = [
  "echo 'Installing frontend dependencies only...'",
  "pnpm install --filter=@oxsig/frontend --frozen-lockfile --prefer-offline"
]

[phases.build]
cmds = [
  "echo 'Building frontend package...'",
  "pnpm --filter=@oxsig/frontend build"
]

[start]
cmd = "cd packages/frontend && pnpm start"

[variables]
NODE_ENV = "production"
NIXPACKS_NO_MUSL = "1"
