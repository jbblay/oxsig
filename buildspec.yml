version: 0.2

env:
  git-credential-helper: yes
  variables:
    OXSIG_CI_DATABASE_URL: postgresql://oxsig_ci:oxsig_ci@127.0.0.1:5432/oxsig_ci

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - corepack prepare pnpm@10.28.0 --activate
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm exec vitest run
