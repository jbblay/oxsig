version: 0.2

env:
  git-credential-helper: yes
  variables:
    # Disposable database created by scripts/ci/provision-postgres.sh.
    # Must stay in sync with that script (asserted by scripts/tests/production-regressions.mjs).
    OXSIG_CI_DATABASE_URL: postgresql://oxsig_ci:oxsig_ci@127.0.0.1:5432/oxsig_ci

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - corepack enable
      - corepack prepare pnpm@10.28.0 --activate
      - pnpm --version
      - pnpm install --frozen-lockfile
  pre_build:
    commands:
      - bash scripts/ci/provision-postgres.sh
  build:
    commands:
      - pnpm server:check
      - pnpm typecheck
      - pnpm audit:reachability
      - pnpm persistence:check
      - pnpm env:contract
      - pnpm test:run
      - pnpm db:verify
      - pnpm build
      - npm install --prefix e2e --no-package-lock
      - ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - DATABASE_URL="$OXSIG_CI_DATABASE_URL" ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs mentor-evidence.spec.mjs
      - OXSIG_SANDBOX_COMMERCE_ENABLED=true DATABASE_URL="$OXSIG_CI_DATABASE_URL" ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs sandbox-commerce.spec.mjs
      - DATABASE_URL="$OXSIG_CI_DATABASE_URL" ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs academy-mission-first.spec.mjs
      - DATABASE_URL="$OXSIG_CI_DATABASE_URL" ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs academy-simulator.spec.mjs
      - DATABASE_URL="$OXSIG_CI_DATABASE_URL" ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs docker-workspace.spec.mjs
