name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxisg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oxisg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxisg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:check
      - run: pnpm env:contract
      - run: node --check scripts/readiness-check.mjs
      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - name: Verify database schema parity
        run: pnpm db:parity
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - run: pnpm prod:check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef
      - run: pnpm typecheck
      - run: pnpm audit:reachability
      - run: pnpm test:run
      - name: Verify PostgreSQL parameter boundary
        run: pnpm exec vitest run src/lib/db/pool.integration.test.ts
        env:
          OXSIG_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      - run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef
