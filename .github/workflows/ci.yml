name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:check
      - run: node --check scripts/readiness-check.mjs
      - run: pnpm prod:check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/oxsig
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/oxsig
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef
