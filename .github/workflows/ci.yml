name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxsig
          POSTGRES_PASSWORD: oxsig_secure_password
          POSTGRES_DB: oxsig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxsig -d oxsig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate database migrations
        run: pnpm db:migrate
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: oxsig
          POSTGRES_USER: oxsig
          POSTGRES_PASSWORD: oxsig_secure_password

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build
