name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxsig-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxisg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oxisg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxisg

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*', 'server.mjs', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production regression tests
        run: node --test scripts/tests/production-regressions.mjs

      - name: Server syntax checks
        run: pnpm server:check

      - name: Environment contract
        run: pnpm env:contract

      - name: Readiness script syntax
        run: node --check scripts/readiness-check.mjs

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Verify database schema parity
        run: pnpm db:parity
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Production checks
        run: pnpm prod:check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef

      - name: Typecheck
        run: pnpm typecheck

      - name: Source reachability audit
        run: pnpm audit:reachability

      - name: Persistence policy check
        run: pnpm persistence:check

      - name: Test
        run: pnpm test:run

      - name: Verify PostgreSQL parameter boundary
        run: pnpm exec vitest run src/lib/db/pool.integration.test.ts
        env:
          OXSIG_TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef

      - name: Install critical browser E2E runtime
        run: |
          npm install --prefix e2e --no-package-lock
          ./e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run critical browser E2E
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          STORAGE_BUCKET: oxsig-ci
          STORAGE_REGION: eu-central-1
          LAB_AWS_ENABLED: 'false'
          CRON_SECRET: ci-cron-secret-0123456789abcdef
          OXSIG_TERMINAL_BRIDGE_SECRET: ci-terminal-bridge-secret-0123456789abcdef0123456789abcdef

      - name: Upload browser E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-browser-e2e
          path: |
            playwright-report
            test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
