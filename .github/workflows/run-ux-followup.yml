name: Run UX follow-up
on:
  push:
    branches: [feature/action-first-responsive-ai-helper-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/action-first-responsive-ai-helper-v1
          fetch-depth: 0
      - name: Patch
        run: |
          if git log -1 --pretty=%B | grep -q '\[ux-followup\]'; then exit 0; fi
          python3 scripts/ux-followup.py
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/vault/page.tsx src/components/collab/CollaborationWorkspace.tsx src/app/live/page.tsx src/components/labs/InfrastructureDesigner.tsx src/components/labs/AiPractitionerDock.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: harden mobile workspace flows [ux-followup]"
          git push origin HEAD:feature/action-first-responsive-ai-helper-v1
