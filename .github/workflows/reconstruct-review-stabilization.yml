name: Reconstruct review stabilization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-stabilization-reconstructed
          fetch-depth: 0
      - name: Disambiguate terminal GET patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/reconstruct_review_stabilization.py')
          text = p.read_text()
          marker = "replace_once(\n    'src/app/api/labs/instances/[id]/terminal/route.ts',"
          start = text.index(marker)
          end = text.index('# The same GET snippet appears before POST', start)
          p.write_text(text[:start] + text[end:])
          PY
      - name: Apply asserted reconstruction patches
        run: python3 scripts/reconstruct_review_stabilization.py
      - name: Add terminal GET expiry guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/labs/instances/[id]/terminal/route.ts')
          text = p.read_text()
          get_start = text.index('export async function GET')
          post_start = text.index('export async function POST')
          before, get_body, after = text[:get_start], text[get_start:post_start], text[post_start:]
          old = "    if (!instance) {\n      return failure(404, 'LAB_NOT_FOUND', 'No Oxsig lab record exists for this account and lab ID.', 'database');\n    }\n    if (instance.runtime_provider !== 'aws-ec2' || !instance.runtime_external_id) {"
          new = "    if (!instance) {\n      return failure(404, 'LAB_NOT_FOUND', 'No Oxsig lab record exists for this account and lab ID.', 'database');\n    }\n    if (instance.expires_at && new Date(instance.expires_at).getTime() <= Date.now()) {\n      return failure(410, 'LAB_EXPIRED', 'The lab session has expired.', 'expiry', instance);\n    }\n    if (instance.runtime_provider !== 'aws-ec2' || !instance.runtime_external_id) {"
          if get_body.count(old) != 1:
              raise SystemExit(f'terminal GET patch expected one match, found {get_body.count(old)}')
          p.write_text(before + get_body.replace(old, new, 1) + after)
          PY
      - name: Validate patch whitespace
        run: git diff --check
      - name: Remove one-shot reconstruction machinery
        run: |
          rm scripts/reconstruct_review_stabilization.py
          rm .github/workflows/reconstruct-review-stabilization.yml
      - name: Commit reconstructed fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Reconstruct review stabilization fixes"
          git push origin HEAD:fix/review-stabilization-reconstructed
