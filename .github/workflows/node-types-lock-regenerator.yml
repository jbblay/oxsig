name: Regenerate Node 22 typings lock

on:
  push:
    branches:
      - chore/node-22-types
    paths:
      - .github/workflows/node-types-lock-regenerator.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/node-22-types
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate lockfile with Node 22 typings
        run: pnpm add --save-dev '@types/node@^22' --lockfile-only
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Align Node typings with Node 22 runtime"
          git push origin HEAD:chore/node-22-types
