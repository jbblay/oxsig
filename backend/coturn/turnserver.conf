# OxSig Coturn Configuration - TURN/STUN Server
# RFC 5766 TURN Server for WebRTC NAT traversal

# ==============================================================================
# Listening Configuration
# ==============================================================================

# Listening IP (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# External IP address (set to your public IP for TURN to work)
# Replace with actual public IP in production
external-ip=YOUR_PUBLIC_IP

# TURN listener port (default 3478)
listening-port=3478

# TLS/DTLS listener port (default 5349)
tls-listening-port=5349

# Relay ports range (for media streams)
min-port=49152
max-port=65535

# ==============================================================================
# Authentication
# ==============================================================================

# Use long-term credentials
lt-cred-mech

# Static user credentials (for development)
# Format: username=password
# In production, use dynamic credentials via REST API
user=oxsig:oxsig_turn_secret_password

# Shared secret for time-limited credentials (recommended for production)
# use-auth-secret
# static-auth-secret=YOUR_RANDOM_SECRET_HERE

# ==============================================================================
# Database (optional - for persistent credential storage)
# ==============================================================================

# Use PostgreSQL for user management (optional)
# psql-userdb="host=localhost dbname=oxsig user=oxsig password=oxsig_secure_password"

# ==============================================================================
# Realm
# ==============================================================================

# TURN server realm (domain)
realm=oxsig.local

# ==============================================================================
# Security & Logging
# ==============================================================================

# Verbose logging (disable in production)
verbose

# Log file location
log-file=/var/log/coturn/turnserver.log

# Disable fingerprint
# fingerprint

# Disable TURN for TCP (use UDP only for better performance)
# no-tcp
# no-tcp-relay

# Enable STUN
# STUN is enabled by default

# Disable multicast (security)
no-multicast-peers

# Disable loopback peers (security)
no-loopback-peers

# ==============================================================================
# TLS/SSL Configuration (for secure connections)
# ==============================================================================

# Path to SSL certificate (for TLS/DTLS)
# cert=/etc/coturn/certs/turn_server_cert.pem

# Path to SSL private key
# pkey=/etc/coturn/certs/turn_server_pkey.pem

# Cipher suite (strong ciphers only)
# cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384"

# ==============================================================================
# Performance Tuning
# ==============================================================================

# Total quota in bytes (100MB per user)
user-quota=102400

# Bandwidth limit per session (512 kbps)
bps-capacity=512000

# Maximum number of allocations per user
max-allocate-lifetime=3600

# Stale nonce (prevent replay attacks)
stale-nonce=600

# ==============================================================================
# WebRTC Specific Settings
# ==============================================================================

# Mobile friendly settings
mobility

# Enable WebRTC compatibility
# fingerprint

# Allow peers from any origin (for development)
# In production, restrict to your domain
# allowed-peer-ip=YOUR_APP_SERVER_IP

# ==============================================================================
# Redis Integration (for scalability)
# ==============================================================================

# Use Redis for session management (recommended for clustered setup)
# redis-userdb="ip=127.0.0.1 dbname=0 password=your_redis_password connect_timeout=30"
# redis-statsdb="ip=127.0.0.1 dbname=1 password=your_redis_password connect_timeout=30"

# ==============================================================================
# Monitoring & Stats
# ==============================================================================

# Enable web admin interface
# web-admin
# web-admin-ip=127.0.0.1
# web-admin-port=8080

# Prometheus metrics
# prometheus
# prometheus-port=9641

# ==============================================================================
# Advanced Security
# ==============================================================================

# Disable UDP (force TCP for corporate firewalls)
# no-udp
# no-udp-relay

# Disable CLI (production security)
no-cli

# Require authentication for all requests
# no-stun

# Enable denial of service protection
# dos-protection

# ==============================================================================
# Allowed/Denied IP Ranges
# ==============================================================================

# Deny access from private IP ranges (security)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Allow specific IP ranges (whitelist your network)
# allowed-peer-ip=YOUR_NETWORK_RANGE

# ==============================================================================
# Process Management
# ==============================================================================

# Run as daemon
# proc-user=turnserver
# proc-group=turnserver

# PID file location
# pidfile=/var/run/turnserver.pid

# ==============================================================================
# Production Recommendations
# ==============================================================================

# 1. Replace YOUR_PUBLIC_IP with your actual public IP
# 2. Generate a strong shared secret for use-auth-secret
# 3. Enable TLS with valid SSL certificates
# 4. Configure Redis for session persistence
# 5. Set up monitoring (Prometheus metrics)
# 6. Restrict allowed-peer-ip to your application servers
# 7. Enable DOS protection
# 8. Use dynamic credentials via REST API
# 9. Set up log rotation for /var/log/coturn/turnserver.log
# 10. Run as non-root user (proc-user/proc-group)

# ==============================================================================
# Docker Deployment Notes
# ==============================================================================

# When running in Docker:
# - Map ports: 3478:3478/tcp, 3478:3478/udp, 5349:5349/tcp, 49152-65535:49152-65535/udp
# - Mount this config: -v ./backend/coturn/turnserver.conf:/etc/coturn/turnserver.conf
# - Mount logs: -v ./logs/coturn:/var/log/coturn
# - Set network mode: --network=host (for proper IP detection)
# - Or use environment variable: EXTERNAL_IP=$(curl -s ifconfig.me)
