# TURN server configuration for WebRTC
listening-port=3478
tls-listening-port=5349

# External IP (update with your server IP)
external-ip=YOUR_SERVER_IP

# Relay IP (usually same as external IP)
relay-ip=YOUR_SERVER_IP

# Listening IPs
listening-ip=0.0.0.0

# Realm
realm=oxsig.local

# Authentication
lt-cred-mech
user=oxsig:${TURN_SECRET}

# Fingerprint
fingerprint

# Logging
verbose
log-file=/var/log/turnserver.log

# Limits
max-bps=1000000
bps-capacity=0

# Security
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Ports
min-port=49152
max-port=65535

# Certificate (for TLS/DTLS)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/key.pem

# Allow TURN
no-stun

# Mobility
mobility

# Database (optional - for persistent users)
# userdb=/var/lib/coturn/turndb
